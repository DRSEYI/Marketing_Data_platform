name: dbt Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dbt-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and test production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    defaults:
      run:
        working-directory: unified_mkt_platform

    env:
      UV_PYTHON: "3.12.9"
      DBT_PROFILES_DIR: ${{ github.workspace }}/.prod-runtime-profile

      PROD_DATABRICKS_HOST: ${{ secrets.PROD_DATABRICKS_HOST }}
      PROD_DATABRICKS_HTTP_PATH: ${{ secrets.PROD_DATABRICKS_HTTP_PATH }}
      PROD_DATABRICKS_CLIENT_ID: ${{ secrets.PROD_DATABRICKS_CLIENT_ID }}
      DBT_ENV_SECRET_PROD_DATABRICKS_CLIENT_SECRET: ${{ secrets.DBT_ENV_SECRET_PROD_DATABRICKS_CLIENT_SECRET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.21"

      - name: Install Python
        run: uv python install 3.12.9

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Prepare production profile
        run: |
          mkdir -p "$DBT_PROFILES_DIR"
          cp ci/profiles.prod.yml.example "$DBT_PROFILES_DIR/profiles.yml"

      - name: Install dbt packages
        run: |
          uv run --locked dbt deps --target prod
          git diff --exit-code -- package-lock.yml

      - name: Check production connection
        run: uv run --locked dbt debug --target prod

      - name: Build and test production
        run: >
          uv run --locked dbt build
          --target prod
          --vars '{"raw_catalog": "marketing_prod"}'
          --fail-fast

      - name: Generate production documentation
        run: >
          uv run --locked dbt docs generate
          --static
          --target prod
          --vars '{"raw_catalog": "marketing_prod"}'

      - name: Remove temporary profile
        if: always()
        run: rm -rf "$DBT_PROFILES_DIR"