version: 2

models:
  - name: int_snapchat_ads_performance
    description: >
      Snapchat advertising performance enriched with the latest
      available ad group attributes and supplied ad and campaign records.
      Missing clicks remain NULL. Spend retains the supplied currency
      and units pending confirmation of the extract's monetary convention.

    columns:
      - name: ad_id
        data_tests:
          - not_null

      - name: account_id
        data_tests:
          - not_null

      - name: campaign_id
        data_tests:
          - not_null

      - name: reporting_date
        data_tests:
          - not_null

      - name: currency_code
        data_tests:
          - not_null

      - name: spend
        data_tests:
          - not_null

      - name: impressions
        data_tests:
          - not_null

      - name: is_ad_missing
        description: "True when no ad matches the statistics record."

      - name: is_ad_group_missing
        description: "True when no current ad group matches the ad."

      - name: is_campaign_missing
        description: "True when no campaign matches the ad group."